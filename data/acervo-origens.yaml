# Registro das ORIGENS do Acervo: uma entrada por origem (um lugar, uma licença, um commit), não por obra.
# O sha256 de cada arquivo BRUTO fica em acervo.lock.json (gravado só por `pnpm acervo:baixar --fixar`).
# `publicavel: false` faz o derivador RECUSAR a origem: nada dela chega ao repositório público.
# `verificador` é o que o cabeçalho do próprio arquivo tem de dizer (tradutor e licença); `esperado` são os
# fatos que a leitura real tem de confirmar (`pnpm acervo:verify`); um arquivo pode trazer o seu `esperado`, que
# vale mais que o da origem (as Antiguidades têm 20 livros, a Guerra 7).
