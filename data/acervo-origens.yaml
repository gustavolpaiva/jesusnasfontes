# ═════════════════════════ Origens fora do Perseus (plano 02-27) ═════════════════════════
# Campos que só estas origens usam:
#   charset            como o bruto decodifica (padrão utf-8); o Gutenberg #2811 declara ISO-8859-1 no cabeçalho.
#   estrutura, secoes  formato `gutenberg`: a estrutura da obra dentro do arquivo e o slug de cada parte, na ordem.
#   rotulo_unidade     formato `html`: a palavra que abre o cabeçalho de cada unidade ("Saying 1: …").
#   correspondencia_refs  tabela `<slug da parte>.<rótulo no arquivo>` → referência moderna; o que não está nela
#                      fica com a numeração da origem e o `acervo:verify` relata.
#   esperado.ausentes  unidades que a ORIGEM não traz (defeito do arquivo): só passa declarado.
#   esperado.paragrafos_total  total de parágrafos do documento (os 114 ditos de Tomé).

# ───────────────────────── Gutenberg: só pelo espelho ─────────────────────────
# O endereço principal (gutenberg.org) bloqueia cliente automatizado e fica FORA da lista de hosts do baixador:
# do Gutenberg só se baixa pelo espelho gutenberg.pglaf.org. A origem não versiona, então `commit` guarda o
# sha256 do arquivo bruto (o mesmo que o lock do bruto) e `data_versao` é o dia da leitura. A licença é lida nas
# DUAS BORDAS do próprio arquivo, nunca inferida da idade da obra.

