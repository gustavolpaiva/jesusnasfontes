# ═════════════════════════ Origens fora do Perseus (plano 02-27) ═════════════════════════
# Campos que só estas origens usam:
#   charset            como o bruto decodifica (padrão utf-8); o Gutenberg #2811 declara ISO-8859-1 no cabeçalho.
#   estrutura, secoes  formato `gutenberg`: a estrutura da obra dentro do arquivo e o slug de cada parte, na ordem.
#   rotulo_unidade     formato `html`: a palavra que abre o cabeçalho de cada unidade ("Saying 1: …").
#   correspondencia_refs  tabela `<slug da parte>.<rótulo no arquivo>` → referência moderna; o que não está nela
#                      fica com a numeração da origem e o `acervo:verify` relata.
#   esperado.ausentes  unidades que a ORIGEM não traz (defeito do arquivo): só passa declarado.
#   esperado.paragrafos_total  total de parágrafos do documento (os 114 ditos de Tomé).

# ───────────────────────── Gutenberg: só pelo espelho ─────────────────────────
# O endereço principal (gutenberg.org) bloqueia cliente automatizado e fica FORA da lista de hosts do baixador:
# do Gutenberg só se baixa pelo espelho gutenberg.pglaf.org. A origem não versiona, então `commit` guarda o
# sha256 do arquivo bruto (o mesmo que o lock do bruto) e `data_versao` é o dia da leitura. A licença é lida nas
# DUAS BORDAS do próprio arquivo, nunca inferida da idade da obra.

gutenberg-plinio-2811:
  nome: Project Gutenberg, eBook 2811 (Letters of Pliny, de Plínio, o Jovem), pelo espelho gutenberg.pglaf.org
  autores:
    - William Melmoth (tradução)
    - F. C. T. Bosanquet (revisão)
    - Project Gutenberg (edição digital; arquivo produzido por David Reed e David Widger)
  # Lida na cauda do próprio arquivo (2811-8.txt, linhas 9794-9797): "Creating the works from public domain
  # print editions means that no one owns a United States copyright in these works". É declaração de domínio
  # público nos Estados Unidos. O cabeçalho diz "Release Date: September, 2001 [Etext #2811]" e não traz o ano
  # da tradução.
  licenca: >-
    Domínio público: obra vinda de edição impressa em domínio público, pela declaração do Project Gutenberg na
    cauda do próprio arquivo ("Creating the works from public domain print editions means that no one owns a
    United States copyright in these works")
  url_licenca: https://gutenberg.pglaf.org/2/8/1/2811/2811-8.txt
  fonte: https://gutenberg.pglaf.org/2/8/1/2811/
  commit: 4fef83b94156718285e4ec46157fa29a783d3c9546c533cf52441ce331d0375b
  data_versao: "2026-11-24"
  alteracoes: >-
    Cabeçalho e licença do Project Gutenberg, introdução e índice dos produtores, cabeçalhos das cartas
    (destinatário) e notas do tradutor removidos do texto; marcadores de nota e etiquetas HTML deixadas pela
    conversão retirados. As linhas de cada carta foram unidas e os blocos internos (citações, editais) unidos por
    um espaço; o texto das palavras não foi reescrito. A numeração de Melmoth foi mantida (`cartas.I` a
    `cartas.CX` e `trajano.I` a `trajano.CXXII`), exceto nas duas cartas da tabela de correspondência.
  formato: gutenberg
  publicavel: true
  motivo: >-
    tradução de Melmoth com revisão de Bosanquet, de edição impressa em domínio público pela declaração do
    Project Gutenberg lida na cauda do próprio arquivo
  # Da numeração de Melmoth para a moderna, só o que a pesquisa conferiu no texto: a carta aos cristãos (XCVII da
  # "Correspondence with the Emperor Trajan") é Epistulae 10.96, e a resposta de Trajano (XCVIII) é 10.97. As
  # outras 229 cartas ficam com a numeração de Melmoth.
  correspondencia_refs:
    "trajano.XCVII": "10.96"
    "trajano.XCVIII": "10.97"
  arquivos:
    - id: 2811-8.txt
      url: https://gutenberg.pglaf.org/2/8/1/2811/2811-8.txt
      slug: plinio-cartas
      idioma: en
      # o cabeçalho do arquivo declara "Character set encoding: ISO-8859-1" (os bytes não são UTF-8 válido)
      charset: iso-8859-1
      limite_bytes: 2097152
      # as duas partes do arquivo, cada uma com a sua numeração: a "Correspondence" recomeça em I
      estrutura: cartas
      secoes: [cartas, trajano]
  verificador:
    tradutores:
      - William Melmoth
      - F. C. T. Bosanquet
    licenca: >-
      Creating the works from public domain print editions means that no one owns a United States copyright in
      these works
  esperado:
    secoes: 2
    paragrafos_total: 231
    paragrafos:
      - ref: "10.96"
        contem:
          - "Christians is this: I asked them whether they were Christians"
          - "extravagant superstition"
        nao_contem: ["[1066]", "[1067]", "Project Gutenberg", "Creating the works"]
      - ref: "10.97"
        contem: ["investigating the charges against the Christians"]
        nao_contem: ["[1069]", "TRAJAN TO PLINY"]
      - ref: "cartas.I"
        contem: ["YOU have frequently pressed me to make a select collection"]
      # o fim da carta XLIV vem colado ao texto desta: ver `ausentes`
      - ref: "cartas.XLIII"
        contem: ["she drew herself back with horror"]
      - ref: "cartas.CX"
        contem: ["You are much pleased, I find, with the account I gave you in my former"]
      - ref: "trajano.I"
        contem: ["THE pious affection you bore, most sacred Emperor"]
      # no arquivo estes numerais vêm com um espaço no meio (LX VII, LXX VII, LXXX VIII, XXX VII, LX VIII, LXX IV)
      - ref: "cartas.LXVII"
      - ref: "cartas.LXXVII"
      - ref: "cartas.LXXXVIII"
      - ref: "trajano.XXXVII"
      - ref: "trajano.LXVIII"
      - ref: "trajano.LXXIV"
      - ref: "trajano.CXXII"
    # Defeito da ORIGEM, declarado para o derivado não fingir que não existe: no arquivo não há cabeçalho da
    # carta XLIV nem começo do texto dela; o fim da XLIV (linhas 2900-2907) vem colado ao texto da XLIII, sem
    # linha em branco. O derivado conserva o arquivo como está.
    ausentes: ["cartas.XLIV"]
    notas_fora_do_texto: true

