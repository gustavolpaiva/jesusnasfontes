  # "Correspondence with the Emperor Trajan") é Epistulae 10.96, e a resposta de Trajano (XCVIII) é 10.97. As
  # outras 229 cartas ficam com a numeração de Melmoth.
  correspondencia_refs:
    "trajano.XCVII": "10.96"
    "trajano.XCVIII": "10.97"
