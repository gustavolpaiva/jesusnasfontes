      - ref: "cartas.LXVII"
      - ref: "cartas.LXXVII"
      - ref: "cartas.LXXXVIII"
      - ref: "trajano.XXXVII"
      - ref: "trajano.LXVIII"
      - ref: "trajano.LXXIV"
      - ref: "trajano.CXXII"
    # Defeito da ORIGEM, declarado para o derivado não fingir que não existe: no arquivo não há cabeçalho da
