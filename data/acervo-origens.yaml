  commit: 4fef83b94156718285e4ec46157fa29a783d3c9546c533cf52441ce331d0375b
  data_versao: "2026-11-24"
  alteracoes: >-
    Cabeçalho e licença do Project Gutenberg, introdução e índice dos produtores, cabeçalhos das cartas
    (destinatário) e notas do tradutor removidos do texto; marcadores de nota e etiquetas HTML deixadas pela
    conversão retirados. As linhas de cada carta foram unidas e os blocos internos (citações, editais) unidos por
    um espaço; o texto das palavras não foi reescrito. A numeração de Melmoth foi mantida (`cartas.I` a
    `cartas.CX` e `trajano.I` a `trajano.CXXII`), exceto nas duas cartas da tabela de correspondência.
