# Os três conjuntos de três perguntas da Leitura contínua. A volta v usa o conjunto (v - 1) mod 3:
# a volta 1, o primeiro; a 2, o segundo; a 3, o terceiro; a 4 volta ao primeiro.
-
  - "O que este capítulo mostra sobre quem Jesus é?"
  - "O que ele pede de quem o ouve?"
  - "O que eu faço com isso hoje, de forma concreta?"
-
  - "Quem reage a Jesus neste capítulo, e como?"
  - "Que frase dele mais contraria o modo como eu vivo?"
  - "O que este capítulo acrescenta ao que os outros evangelhos contam?"
-
  - "O que eu não tinha notado nas leituras anteriores?"
  - "Que pergunta este texto deixa sem resposta para mim?"
  - "Qual versículo vale guardar de memória?"
