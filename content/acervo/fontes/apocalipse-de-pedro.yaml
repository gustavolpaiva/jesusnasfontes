limites_pt: >-
  Apocalipse apócrifo que não pertence ao cânone do Novo Testamento, de composição posterior aos fatos e
  estimada antes da metade do século II d.C. O texto preservado é um fragmento que começa no meio de um
  discurso de Jesus sobre o fim e termina de chofre num catálogo de castigos; o texto reflete a tradição de
  quem o escreveu e nada mais se afirma sobre o seu valor histórico.
secoes:
  - slug: v-ii
    titulo: Fragmento de Akhmîm
    resumo_pt: >-
      Começa no meio de um discurso de Jesus sobre falsos profetas; no monte, a pedido dos doze,
      mostram-se dois homens mais brancos que a neve, os justos que partiram. Pedro vê o lugar dos justos,
      terra florida fora do mundo, e, em frente, o lugar do castigo. Segue
      o catálogo: blasfemos pendurados pela língua sobre fogo, os que pervertem a justiça num lago de lodo
      flamejante, adúlteros, homicidas com serpentes (enquanto as almas dos mortos aprovam o juízo), os que
      provocaram aborto, perseguidores, caluniadores, testemunhas falsas, ricos sem piedade rolando em
      seixos e usurários no lago de pez e sangue — até cortar de chofre, no meio da lista, "nos que
      deixaram o caminho de Deus…".
    palavras_chave_pt: [lugar dos justos, castigos, falsos profetas, monte, blasfemos, homicidas, aborto, ricos, usurários, Akhmîm]
  - slug: v-iii
    titulo: Fragmentos citados por outros autores
    resumo_pt: >-
      Cinco passos que a edição recolhe de escritores posteriores: Clemente de Alexandria (nas Eclogae)
      cita as crianças nascidas fora de tempo, entregues a um anjo que zela por elas para que atinjam a
      melhor morada, e o leite das mulheres que, coalhado, gera feras que as devoram; Macário de Magnésia
      (na Apocritica) cita a terra apresentando todos os homens diante de Deus no dia do juízo, ela
      própria julgada junto com o céu; Clemente de novo, sobre os bebês expostos, criados por um anjo até
      serem como os fiéis de cem anos; e Metódio (no Banquete), sobre os nascimentos prematuros entregues
      a anjos, mesmo de adultério.
    palavras_chave_pt: [fragmentos, Clemente de Alexandria, Macário de Magnésia, Metódio, nascidos fora de tempo, anjo, dia do juízo]
