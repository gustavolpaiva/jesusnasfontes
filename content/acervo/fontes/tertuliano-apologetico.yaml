limites_pt: >-
  Defesa escrita em latim e endereçada aos governantes do Império Romano. A tradução inglesa lida é a do
  reverendo S. Thelwall, declarada na abertura do próprio texto, no volume 3 da coleção Ante-Nicene Fathers.
  A divisão inclui as Elucidations apensas pelo editor americano da coleção, com cronologia do autor e notas
  sobre os estudos de Kaye.
secoes:
  - slug: iv-iii
    titulo: Texto
    resumo_pt: >-
      Defesa endereçada aos governantes do Império: protesta contra a condenação pelo nome, sem crime
      provado, recusa a injustiça de obrigar à adoração e reivindica liberdade para o culto. Refuta as
      acusações e as religiões do Império, mostra a antiguidade e a autoridade das Escrituras, descreve os
      costumes e a vida das comunidades, e proclama que, quanto mais os cristãos são ceifados, mais crescem
      em número, pois o sangue dos cristãos é semente. Fecha com as Elucidations do editor da coleção, que
      trazem cronologia do autor e notas de Kaye sobre a obra.
    palavras_chave_pt: [governantes romanos, liberdade de religião, perseguição, mártires, sangue é semente, Escrituras, costumes cristãos, Elucidations]
