  de quem o compilou e nada mais se afirma sobre o seu valor histórico.
secoes:
  - slug: vii-xi
    titulo: Texto
    resumo_pt: >-
      Compilação que abre invocando a Trindade e anunciando o livro dos milagres; no primeiro capítulo,
      lido no livro de José o sumo sacerdote, o menino fala no berço dizendo ser Jesus, o Filho de Deus, o
      Logos. Vêm o recenseamento, o nascimento na gruta acesa, a velha curada da paralisia, os magos, a
      faixa incombustível; na fuga ao Egito, o endemoninhado curado com a roupa de Jesus, mudas e
      leprosas, aos ladrões Titos e Dumacos Jesus prediz a cruz futura, a fonte de Matarea e
      três anos em Mênfis; de volta, curas em Belém, crianças viradas cabritos, o tintureiro Salem, o trono real, Judas Iscariotes menino possuído, os mestres vencidos, até os doze anos no templo e o
      batismo no Jordão aos trinta.
    palavras_chave_pt: [menino no berço, Logos, gruta, magos, fuga ao Egito, ladrões Titos e Dumacos, Matarea, tintureiro, Judas Iscariotes, batismo no Jordão]
