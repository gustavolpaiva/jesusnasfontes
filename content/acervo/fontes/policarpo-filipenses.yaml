limites_pt: >-
  Carta escrita em grego por Policarpo, bispo de Esmirna, à comunidade de Filipos, e datada pela maior parte
  dos estudiosos na primeira metade do século II. Responde a um pedido dos filipenses com exortações de
  conduta e com a remessa das cartas de Inácio que tinha consigo. O texto chegou junto com as cartas de
  Inácio, na mesma tradição manuscrita.
secoes:
  - slug: ii-x
    titulo: Texto
    resumo_pt: >-
      Carta de exortação a permanecer na fé e na conduta ensinadas desde o princípio, com instruções para
      viúvas, diáconos, presbíteros e jovens, e o aviso de que o amor ao dinheiro é o começo de todos os
      males. Lamenta o desvio de Valens, que foi presbítero entre eles, e pede a sua correção. Fecha com a
      remessa das cartas de Inácio que a comunidade pedira e com orações pelos presos e perseguidos.
    palavras_chave_pt: [Filipos, Policarpo, viúvas, presbíteros, amor ao dinheiro, Valens, cartas de Inácio]
