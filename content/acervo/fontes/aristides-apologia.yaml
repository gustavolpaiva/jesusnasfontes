limites_pt: >-
  Apologia cristã primitiva escrita em grego, de datação debatida; a tradução do siríaco a apresenta como
  defesa feita diante do imperador Adriano. Sobrevive em duas formas: o texto siríaco e uma versão grega
  refeita, preservada dentro da história medieval de Barlaam e Josafé, ambas traduzidas neste volume. O texto
  lido é a tradução inglesa do volume 9 da coleção Ante-Nicene Fathers.
secoes:
  - slug: xiii-iii
    titulo: Conforme a história de Barlaam e Josafé (grego)
    resumo_pt: >-
      A apologia na versão grega, preservada dentro da história de Barlaam e Josafé: o autor conclui, pela
      ordem do mundo, que há um Deus sem começo e sem fim, e passa em revista as classes de homens — caldeus,
      gregos e egípcios com os seus deuses, os judeus e os cristãos — para mostrar quais participam da
      verdade. Fecha declarando ao rei que nada disse além do que está nos escritos dos cristãos, e exorta-o
      a adorar Deus, o Criador, para escapar da condenação e herdar a vida eterna.
    palavras_chave_pt: [Barlaam e Josafé, grego, apologia, rei, deuses dos gregos, egípcios, caldeus, verdade]
  - slug: xiii-iv
    titulo: Tradução do siríaco
    resumo_pt: >-
      A mesma apologia na tradução do siríaco, apresentada como defesa de Aristides, filósofo ateniense, a
      Hadriano, o rei: Deus sem começo nem fim, conhecido pela criação, e quatro classes de homens —
      bárbaros, gregos, judeus e cristãos —, com a origem da religião dos cristãos em Jesus, o Messias,
      chamado Filho do Deus Altíssimo. Termina com a advertência do juízo que virá sobre o gênero humano por
      Jesus, o Messias.
    palavras_chave_pt: [siríaco, Adriano, Jesus Messias, apologia, bárbaros, gregos, judeus, cristãos]
