secoes:
  - slug: v-v
    titulo: Fragmentos
    resumo_pt: >-
      Fragmentos da cronografia em cinco livros: a cronologia mítica dos egípcios e dos caldeus, com os seus
      milhares de anos, recusada como vã, o dilúvio, a tenda do pastor Jacó conservada em Edessa até o tempo
      de Antonino e as concordâncias de datas pelas Olimpíadas, com Beroso, Thallus, Castor e outros citados.
      Traz a resposta a Thallus, que chamou de eclipse do sol a escuridão na paixão do Salvador, e fecha com
      ação de graças ao Pai por Jesus Cristo, Salvador de todos.
    palavras_chave_pt: [fragmentos, cronologia, Olimpíadas, Thallus, eclipse do sol, escuridão, Beroso, Edessa]
