secoes:
  - slug: ix-xvii
    titulo: Texto
    resumo_pt: >-
      Carta de consolo de um pai preso ao filho: Mara, filho de Serapião, exorta Serapião, ainda menino, a
      seguir a sabedoria em vez das riquezas e a suportar com fortaleza as desgraças do tempo. No meio da
      consolação, lembra os sábios perseguidos que sobreviveram nos discípulos — Sócrates por causa de
      Platão, Pitágoras e o rei sábio por causa das novas leis que estabeleceu — e os judeus levados à
      desolação e expulsos do seu reino para toda terra. Fecha com o pedido de domínio de si, a vontade de
      deixar recordações por escrito e a anedota de Mara rindo do Tempo estando acorrentado.
    palavras_chave_pt: [rei sábio, judeus, sabedoria, consolo, prisão, Sócrates, Pitágoras]
