limites_pt: >-
  Harmonia dos quatro evangelhos composta em siríaco por Taciano no século II; o texto original se perdeu e
  chegou por uma tradução árabe medieval, declarada nas subscrições como obra do sacerdote Abu'l Faraj
  'Abdulla ibn-at-Tayyib, conhecida por dois manuscritos. Lê-se aqui a tradução inglesa do árabe publicada
  no volume 9 da coleção Ante-Nicene Fathers.
secoes:
  - slug: iv-iii
    titulo: Texto
    resumo_pt: >-
      Harmonia dos quatro evangelhos em narrativa contínua: abre com o prólogo de João, no princípio era o
      Verbo, e junta os relatos da infância de Zacarias e Isabel, do nascimento de João e de Jesus, o
      ministério, os ensinos, os milagres, a paixão e a ressurreição, até a ascensão em Betânia e a nota
      final de que o mundo não caberia nos livros se tudo fosse escrito. Os versículos dos evangelhos entram
      numerados entre colchetes, como na edição.
    palavras_chave_pt: [harmonia, quatro evangelhos, João, Verbo, infância, ministério, paixão, ressurreição, ascensão]
  - slug: iv-iv
    titulo: Subscrições
    resumo_pt: >-
      As subscrições com que a harmonia fecha nos dois manuscritos árabes: o manuscrito Borgiano declara
      que o evangelho foi compilado por Taciano a partir dos quatro evangelistas e que a tradução do
      siríaco para o árabe é do sacerdote Abu'l Faraj 'Abdulla ibn-at-Tayyib, de um exemplar copiado por
      'Isa ibn-'Ali; o manuscrito do Vaticano declara apenas que o santo evangelho conhecido como
      Diatessaron foi compilado por Taciano a partir dos quatro evangelhos, sem nomear tradutor nem
      copista.
    palavras_chave_pt: [subscrições, manuscrito Borgiano, Vaticano, Abu'l Faraj, tradução árabe, colofão]
