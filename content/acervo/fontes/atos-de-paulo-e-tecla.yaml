limites_pt: >-
  Acto apócrifo que não pertence ao cânone do Novo Testamento, de composição posterior aos fatos e
  estimada no século II d.C. Narra a pregação de Paulo em Icônio e Antioquia e a jornada da virgem Tecla,
  que o escuta e recusa o noivado; a introdução da edição registra que Tertuliano o atribuiu a um
  presbítero da Ásia. O texto reflete a tradição de quem o escreveu e nada mais se afirma sobre o seu
  valor histórico.
secoes:
  - slug: vii-xxvi
    titulo: Texto
    resumo_pt: >-
      Paulo sobe a Icônio com Demas e Hermógenes, hospeda-se com Onesíforo e, pregando a castidade, é
      ouvido pela virgem Tecla, que rompe o
      noivado com Tâmiris. Denunciado e açoitado, Paulo é expulso; Tecla, condenada à fogueira, é salva
      por nuvem de água e granizo. Em Antioquia, recusando Alexandre, é condenada às feras; a rainha
      Trifena acolhe-a em lugar da filha morta, a leoa lhe lambe os pés e ela batiza-se numa cova de água.
      Solta, reencontra Paulo em Mira, é enviada a ensinar e vive setenta e dois anos
      numa gruta de Selêucia, curando, até entrar viva na rocha; morre aos noventa
      anos perto do túmulo de Paulo. A edição traz ainda o final alternativo do manuscrito de Grabe,
      no monte Calamon.
    palavras_chave_pt: [Paulo, Tecla, Icônio, castidade, fogueira, Trifena, batismo, feras, Selêucia, final alternativo]
