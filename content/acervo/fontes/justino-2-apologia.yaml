secoes:
  - slug: viii-iii
    titulo: Texto
    resumo_pt: >-
      Defesa provocada pelas execuções ordenadas pelo prefeito Urbico em Roma: Justino narra o caso de uma
      mulher convertida que acabou por denunciar o marido intemperante, e a morte de quem confessava ser
      cristão, como Lucius, que agradeceu ao ser condenado. Critica o filósofo Crescens e os juízes que
      condenam o que não entendem, sustenta que todos os que viveram segundo o Logos foram perseguidos, e
      recorda a própria conversão, quando via os cristãos sem medo da morte; encerra pedindo a publicação do
      escrito e a conversão dos leitores.
    palavras_chave_pt: [Urbico, Roma, Crescens, Logos, martírio, conversão, Simão, denunciação]
