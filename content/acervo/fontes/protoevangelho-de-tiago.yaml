limites_pt: >-
  Evangelho apócrifo que não pertence ao cânone do Novo Testamento, de composição posterior aos fatos que
  narra, estimada no século II d.C. Narra o nascimento e a infância de Maria e o nascimento de Jesus a partir
  de tradições próprias; o texto reflete a tradição de quem o escreveu e nada mais se afirma sobre o seu
  valor histórico.
secoes:
  - slug: vii-iv
    titulo: Texto
    resumo_pt: >-
      Narra o nascimento e a infância de Maria: Joaquim e Ana concebem na velhice depois de oração e jejum,
      a menina é entregue ao templo aos três anos e, aos doze, confiada por sorteio ao viúvo José, cuja vara
      floresce numa pomba. Na casa de José, Maria recebe a anunciação enquanto fia o púrpura; superada a
      acusação de adultério pela prova da água do juízo, nasce Jesus numa gruta de Belém, com a parteira e
      Salomé como testemunhas. Seguem-se os magos, a matança dos inocentes, a fuga de Isabel com João, o
      assassinato de Zacarias no templo e o fecho assinado por Tiago, que diz ter escrito em Jerusalém.
    palavras_chave_pt: [Maria, Joaquim e Ana, templo, José, anunciação, Belém, gruta, parteira, magos, Zacarias]
