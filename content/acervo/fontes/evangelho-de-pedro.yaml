limites_pt: >-
  Fragmento de evangelho apócrifo que não pertence ao cânone do Novo Testamento, de composição posterior
  aos fatos, datada entre o início e o fim do século II d.C. segundo os pesquisadores que a introdução do
  volume cita; o texto preservado começa no meio da paixão e termina no meio de uma frase. O que relata
  reflete a tradição de quem o escreveu e nada mais se afirma sobre o seu valor histórico.
secoes:
  - slug: iii-ii
    titulo: Fragmento de Akhmîm
    resumo_pt: >-
      O fragmento começa no meio da paixão: nenhum dos judeus lava as mãos, Herodes ordena prender o Senhor
      e José, amigo de Pilatos e do Senhor, pede o corpo para sepultar. Seguem a zombaria com a púrpura, a
      crucificação entre dois malfeitores ("como quem não tem dor"), as trevas ao meio-dia, o grito "minha
      força, minha força, tu me abandonaste" e a morte, com a terra a tremer. Vigias
      selam o túmulo; na noite do domingo dois jovens brilhantes descem, a pedra se move e da tumba saem
      três homens e uma cruz que responde aos céus. Maria Madalena acha o túmulo vazio; o relato acaba no
      meio de uma frase, com Pedro e André pegando as redes e Levi, filho de Alfeu, "a quem o Senhor…".
    palavras_chave_pt: [Herodes, Pilatos, José, crucificação, trevas, túmulo selado, cruz que fala, Maria Madalena, Akhmîm]
