limites_pt: >-
  Homilia anônima em grego, do século II, transmitida junto com a Primeira Carta de Clemente e conhecida por
  isso como Segunda Clemente; a própria origem a apresenta como homilia antiga de autor desconhecido. Dirige-se
  a uma comunidade como pregação, lendo as escrituras e as palavras do Senhor em tom de exortação. Chegou pelos
  mesmos manuscritos da Primeira Carta, entre eles o Códice Alexandrino.
secoes:
  - slug: ii-ii
    titulo: Texto
    resumo_pt: >-
      Sermão que exorta os ouvintes ao arrependimento e à vida santa enquanto há tempo, tratando as coisas
      deste mundo como estranhas ao cristão e pedindo que confessem Cristo pelas obras. Desenvolve a
      guarda da carne em pureza, a Igreja espiritual anterior ao sol e à lua, a recompensa prometida a
      quem faz a vontade do Pai e o juízo vindouro, adverte contra os que duvidam com o coração dividido e
      acolhe a repreensão que desvia da injustiça. Consola os justos que sofrem agora, pois Deus não paga
      logo a recompensa, e encerra com louvor ao Deus invisível, Pai da verdade.
    palavras_chave_pt: [arrependimento, santidade, pureza, recompensa, coração dividido, sermão, juízo]
