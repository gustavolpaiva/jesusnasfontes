secoes:
  - slug: vii-ii
    titulo: Fragmentos
    resumo_pt: >-
      Trechos que sobraram da Exposição dos oráculos do Senhor: a nota sobre os cinco livros e o prefácio do
      próprio Papias, que diz ter recebido o que ouviu dos anciãos — o que disseram André, Pedro, Filipe,
      Tomé, Tiago, João e Mateus, e o que diziam Aristião e o presbítero João. Reúnem ainda a tradição sobre
      Marcos, intérprete de Pedro, e sobre Mateus, que pôs os oráculos em hebraico, a esperança do milênio
      com as vinhas colossais, a morte inchada de Judas, os graus das moradas no além e a lista das Marias do
      evangelho.
    palavras_chave_pt: [fragmentos, Eusébio, Marcos, Mateus, anciãos, milênio, Hierápolis, oráculos do Senhor]
