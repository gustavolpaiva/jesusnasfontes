limites_pt: >-
  Sátira escrita em grego no século II por um autor pagão hostil ao cristianismo; o cristianismo aparece de
  passagem, nas cenas da vida de Peregrino. A obra é humorística e não busca relatar fatos com exatidão. O texto
  lido é a tradução inglesa de Fowler e Fowler (1905), preservada em cópias medievais.
secoes:
  - slug: texto
    titulo: Texto
    resumo_pt: >-
      Sátira em forma de carta a Crônio sobre a vida e a morte de Peregrino, chamado Proteu, que buscou a fama em
      muitas transformações e terminou ateando a própria pira em Olímpia. No caminho ele adota o cristianismo na
      Palestina, onde se torna profeta e chefe da comunidade, e é sustentado na prisão pelas comunidades da Ásia
      antes de abraçar o cinismo.
    palavras_chave_pt: [Peregrino, Proteu, sátira, cristianismo, filósofo cínico, Olímpia]
