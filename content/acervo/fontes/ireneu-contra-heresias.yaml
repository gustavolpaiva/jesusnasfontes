limites_pt: >-
  Obra escrita em grego em cinco livros por um bispo de Lião, contra as doutrinas gnósticas do seu tempo.
  O original grego se perdeu: o texto chegou por uma versão latina antiga, exceto boa parte do livro 1,
  preservada em grego por citações antigas, como explica a introdução do volume. O texto lido é a tradução
  inglesa do volume 1 da coleção Ante-Nicene Fathers.
secoes:
  - slug: ix-ii
    titulo: Livro 1
    resumo_pt: >-
      Expõe o sistema dos que o autor chama de hereges: o que ele chama de falsa ciência dos valentinianos,
      com as suas genealogias e a doutrina dos eons, a sucessão de mestres que remonta a Simão, o Mago, e as
      opiniões de Marcão e dos demais. Desfila ponto por ponto as noções deles sobre o Pleroma e a formação
      do mundo, e fecha com a comparação do sistema a uma raposa desentocada, afirmando que, manifestas as
      doutrinas, poucas palavras bastarão para derrubá-las.
    palavras_chave_pt: [valentinianos, Simão o Mago, gnose, Pleroma, eons, Marcão, genealogias]
  - slug: ix-iii
    titulo: Livro 2
    resumo_pt: >-
      Argumenta contra o sistema exposto no livro anterior, que o primeiro capítulo recapitula, dos
      valentinianos a Marcão. Discute os nomes divinos das Escrituras hebraicas — Sabaoth, Eloë, Adonai —
      para sustentar que anunciam um só Ser, e fecha declarando que a pregação dos apóstolos, o ensino do
      Senhor, os anúncios dos profetas e a ministração da lei louvam todos o mesmo Deus, Pai do universo, e
      não seres diversos.
    palavras_chave_pt: [refutação, Sabaoth, Eloë, Adonai, um só Deus, apóstolos, profetas, lei]
  - slug: ix-iv
    titulo: Livro 3
    resumo_pt: >-
      Responde aos que chama de hereges com a regra da fé: o evangelho como fundamento e coluna da Igreja, os quatro
      evangelhos — nem mais nem menos, como as quatro zonas do mundo e os quatro ventos — e a sucessão dos
      bispos que guarda o ensino recebido. Reúne a tradição sobre os evangelhos — Mateus, que os escreveu
      entre os hebreus no seu próprio dialeto, e Marcos, discípulo e intérprete de Pedro —, contesta as
      alegorias valentinianas sobre a sua Mãe e o Pleroma, e fecha orando para que esses homens se convertam
      à Igreja de Deus e conheçam o único Criador.
    palavras_chave_pt: [regra da fé, quatro evangelhos, coluna da Igreja, sucessão dos bispos, Marcos, Mateus]
  - slug: ix-vi
    titulo: Livro 4
    resumo_pt: >-
      Argumenta, como prometera, com as palavras do próprio Senhor: mostra que anunciam um só Pai, Criador
      deste mundo, contra os que ele chama de hereges e que o separam do Deus do Antigo Testamento. Percorre as Escrituras, o
      chamado dos gentios e a desobediência dos filhos, que, como os deserdados pela lei, deixam de ser
      herdeiros do Pai; fecha prometendo acrescentar, no que se segue, a refutação que ainda falta.
    palavras_chave_pt: [palavras do Senhor, Criador, Antigo Testamento, gentios, filhos desobedientes, herdeiros]
  - slug: ix-vii
    titulo: Livro 5
    resumo_pt: >-
      Trata da redenção e das últimas coisas: o Verbo feito homem como único modo de conhecer as coisas de
      Deus, a defesa da ressurreição da carne contra quem a negava, o Anticristo como apóstata e escravo
      ansioso por ser adorado como Deus, e os tempos do fim. Fecha com João e os profetas, que teriam
      previsto a primeira ressurreição dos justos, a herança no reino e a criação liberta da escravidão.
    palavras_chave_pt: [Verbo encarnado, ressurreição da carne, Anticristo, primeira ressurreição, reino, milênio]
