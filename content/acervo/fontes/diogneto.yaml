limites_pt: >-
  Apologia anônima em grego, endereçada ao excelentíssimo Diogneto, que pergunta em que Deus crêem os
  cristãos e como os adoram; a data é incerta e situada no século II. Contrasta o culto cristão com os deuses
  dos gregos e com a observância judaica, e apresenta a vida dos cristãos no mundo pela imagem da alma no
  corpo. Foi preservada por um único manuscrito, destruído em 1870, e sobrevive pelas cópias feitas antes.
secoes:
  - slug: ii-xv
    titulo: Texto
    resumo_pt: >-
      Resposta ao questionário de Diogneto sobre a religião dos cristãos: rejeita os deuses dos gregos,
      feitos de matéria e guardados por homens, e a observância judaica das luas e dos sábados, entendida como
      superstição. Descreve os cristãos como estrangeiros em cada terra, espalhados pelas cidades como a alma
      pelos membros do corpo, perseguidos e condenados às feras sem negar o Senhor, e expõe o envio do Filho
      por parte de Deus, quando a iniquidade se cumpria. Encerra com a exortação ao conhecimento verdadeiro e
      à prática dos mandamentos que levam à vida.
    palavras_chave_pt: [Diogneto, apologia, cristãos, alma no corpo, deuses gregos, superstição judaica, Filho de Deus]
