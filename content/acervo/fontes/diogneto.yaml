limites_pt: >-
  Apologia anônima em grego, endereçada ao excelentíssimo Diogneto, que pergunta em que Deus crêem os
  cristãos e como os adoram; a data é incerta e situada no século II. Contrasta o culto cristão com os deuses
  dos gregos e com a observância judaica, e apresenta a vida dos cristãos no mundo pela imagem da alma no
  corpo. Foi preservada por um único manuscrito, destruído em 1870, e sobrevive pelas cópias feitas antes.
secoes:
  - slug: ii-xv
    titulo: Texto
    resumo_pt: >-
      Resposta ao questionário de Diogneto sobre a religião dos cristãos: rejeita os deuses dos gregos,
      feitos de matéria e guardados por homens, e a observância judaica dos sacrifícios, dos alimentos,
      dos sábados e das luas, tida por insensata. Descreve os cristãos como estrangeiros em cada terra,
      espalhados pelas cidades como a alma pelos membros do corpo, odiados e perseguidos sem que o mundo
      saiba dizer por quê. Expõe o envio do Filho, em mansidão e não à força, pede o conhecimento do Pai e
      a imitação de Deus pelo amor ao próximo. Encerra com o Verbo revelado aos discípulos e a imagem do
      Paraíso, com a árvore do conhecimento e a da vida.
    palavras_chave_pt: [Diogneto, apologia, cristãos, alma no corpo, deuses gregos, superstição judaica, Filho de Deus, Verbo]
