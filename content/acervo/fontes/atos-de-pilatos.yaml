limites_pt: >-
  Escrito apócrifo que não pertence ao cânone do Novo Testamento, de composição posterior aos fatos, com
  datação debatida entre os séculos II e V d.C. Apresenta-se como ata do processo de Jesus diante de Pilato
  e reúne três formas do mesmo relato (duas gregas e uma latina); o texto reflete a tradição de quem o
  escreveu e nada mais se afirma sobre o seu valor histórico.
secoes:
  - slug: vii-xii
    titulo: Primeira forma grega
    resumo_pt: >-
      Abre com o prólogo de Ananias, que traduziu do hebraico os memoriais do tempo de Pilatos; o corpo
      apresenta-se como relato de Nicodemos. No tribunal vêm as acusações, os estandartes que se dobram diante de Jesus, o sonho da mulher de Pilatos, os doze que atestam o noivado, as testemunhas curadas (o paralítico de trinta e oito anos, a hemorrágica), a defesa de Nicodemos, Barrabás, a lavagem das mãos e a crucificação entre Dismas e Gestas. Depois da escuridão, José de Arimateia pede o corpo e é preso, libertado por Jesus; os
      guardas do túmulo relatam o anjo e recebem dinheiro para calar; três
      testemunhas relatam a ascensão no monte Mamilch e o Sinédrio delibera, com a
      bênção do povo no fecho.
    palavras_chave_pt: [Ananias, Nicodemos, estandartes, Barrabás, Dismas e Gestas, José de Arimateia, prisão selada, monte Mamilch, ascensão]
  - slug: vii-xiii
    titulo: Segunda forma grega
    resumo_pt: >-
      Apresenta-se como narrativa de Enéias, judeu, vertida por Nicodemo; Jesus é enviado a Herodes, que o
      veste de branco e dele não obtém resposta. Na subida do
      calvário, Simão de Cirene carrega a cruz e Maria, com João e as mulheres, lamenta aos pés do
      madeiro pedindo que a cruz se incline; Verônica é nomeada entre as testemunhas curadas. José e
      Nicodemos sepultam o corpo; José, preso, desaparece da prisão fechada; os soldados relatam o anjo,
      são subornados e espalham que o corpo foi roubado. O relato fecha com três testemunhas ouvidas em
      separado — o sacerdote Finees, o levita Agai e o soldado Adas — declarando ter visto Jesus subir ao
      céu no monte das Oliveiras diante de uns quinhentos.
    palavras_chave_pt: [Enéias, Herodes, Simão de Cirene, Maria aos pés da cruz, Verônica, Finees, Agai e Adas, monte das Oliveiras]
  - slug: vii-xv
    titulo: Forma latina
    resumo_pt: >-
      Traz o prólogo de Enéias, que diz ter traduzido os memoriais hebraicos do tempo de Pilatos. O
      processo segue de perto a primeira forma grega: acusações,
      estandartes que se inclinam, o sonho da esposa de Pilatos, os doze que atestam o noivado, as
      testemunhas curadas — entre elas Verônica, nomeada —, a defesa de Nicodemos, Barrabás e a lavagem
      das mãos; na cruz, entre Dismas e Gestas, vêm a escuridão, o centurião e a lança de Longino. José de
      Arimateia, preso e libertado milagrosamente, relata a visita de Jesus na prisão; os guardas
      subornados calam o anjo; Finees, Addas e Egias relatam a ascensão no monte Mambre, e o conselho
      encerra bendizendo o nome daquele de quem falam as Escrituras.
    palavras_chave_pt: [Enéias, Longino, Verônica, Dismas e Gestas, José de Arimateia, monte Mambre, conselho, bênção]
