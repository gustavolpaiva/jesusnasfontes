limites_pt: >-
  Relato em grego, escrito em nome da igreja de Esmirna e endereçado à de Filomélio, sobre a prisão, o
  julgamento e a morte de Policarpo; a data dos fatos é debatida e situada em meados do século II. Narra os
  acontecimentos como testemunho enviado às demais comunidades. O texto chegou por manuscritos gregos e por
  uma versão latina antiga, e o colofão declara que Pionius o copiou de exemplares mais antigos.
secoes:
  - slug: ii-xi
    titulo: Texto
    resumo_pt: >-
      Relato da perseguição em Esmirna, da prisão de Policarpo por traição de gente da própria casa e do seu
      interrogatório diante do procônsul, no estádio, onde se recusa a negar o Senhor. Registra o exemplo
      negativo de Quinto, que se apresentou por vontade própria e recuou diante das feras, e descreve a morte
      de Policarpo no fogo e pelo punhal, quando o fogo não o consumia. Fecha com o recolhimento dos ossos
      pela comunidade e a lembrança anual do dia do martírio, e com o colofão de Pionius.
    palavras_chave_pt: [Policarpo, Esmirna, martírio, procônsul, estádio, Quinto, Pionius]
