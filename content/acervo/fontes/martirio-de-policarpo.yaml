limites_pt: >-
  Relato em grego, escrito em nome da igreja de Esmirna e endereçado à de Filomélio, sobre a prisão, o
  julgamento e a morte de Policarpo; a data dos fatos é debatida e situada em meados do século II. Narra os
  acontecimentos como testemunho enviado às demais comunidades. O texto chegou por manuscritos gregos e por
  uma versão latina antiga, e o colofão declara que Pionius o copiou de exemplares mais antigos.
secoes:
  - slug: ii-xi
    titulo: Texto
    resumo_pt: >-
      Carta da igreja de Esmirna à de Filomélio sobre os mártires da perseguição em Esmirna, com os
      suplícios e Germânico diante das feras. Narra o caso de Quinto, que se apresentou por vontade
      própria e, vendo as feras, cedeu e jurou; a prisão de Policarpo, traído por gente da própria casa;
      seu interrogatório pelo procônsul no estádio, onde se recusa a negar o Cristo; e sua morte: o fogo
      não o consome e ele é morto a punhal. Segue o recolhimento dos ossos, a celebração do dia do
      martírio e a data da morte; fecha com as cópias da carta (Gaio, Sócrates, Pionius) e uma nota sobre
      Irineu e Marcião.
    palavras_chave_pt: [Policarpo, Esmirna, martírio, procônsul, estádio, Quinto, Germânico, Pionius]
