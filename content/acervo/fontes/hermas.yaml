# Fonte do Acervo: O Pastor de Hermas, na tradução inglesa de Lightfoot (edição CCEL). A obra é uma sequência
# de visões narradas por Hermas; o ThML da origem a traz numa divisão única, sem separar visões, mandamentos
# e parábolas (plano 02-10). O texto vem do derivado `data/acervo-derivados/hermas.json`, gerado por
# `pnpm acervo:derivar` a partir da origem `ccel-lightfoot-fathers` (data/acervo-origens.yaml): do volume
# único de Lightfoot, a divisão ii.xiv. O resumo auxiliar é escrita automática de busca (D-18) e nunca
# substitui o texto.
slug: hermas
titulo: O Pastor de Hermas
autor: Hermas
epoca: primeira metade do século II (estimativa)
nivel: primaria
tipo_texto: integral
idioma: en
publicada: true
licenca: dp-declarado-pela-origem
licenca_url: https://ccel.org/ccel/lightfoot/fathers.xml
origem_nome: Christian Classics Ethereal Library
origem_url: https://ccel.org/ccel/lightfoot/fathers
# O volume não tem introduções de obra nem nota de tradutor: a página de título credencia "THE APOSTOLIC
# FATHERS by J. B. Lightfoot" (i-p1.3) e o cabeçalho digital o descreve como "J.B. Lightfoot's collection
# and translation of many of the works of the Apostolic fathers" — Lightfoot é o responsável pelo volume E
# o tradutor das obras (evidência e `tradutor_tambem_editor` registrados em data/acervo-origens.yaml). A
# edição não nomeia nenhum outro responsável (J. R. Harmer não aparece no arquivo); não se inventa.
tradutor: J. B. Lightfoot
editor: J. B. Lightfoot
traduzida_por_nos: false
# A origem não declara a edição (pubHistory vazio): só cita a reimpressão de Baker Book House, 1956. Nenhum
# ano de edição ou de tradução é atribuído de memória (plano 02-10).
edicao: "edição não declarada pela origem; o cabeçalho cita apenas a reimpressão de Baker Book House, 1956; a página de título credencia o volume a J. B. Lightfoot e o cabeçalho digital o descreve como sua coleção e tradução"
# Teto próprio de seção (Pitfall 9): a seção é a OBRA inteira — uma divisão só no volume de Lightfoot, que não
# separa visões, mandamentos e parábolas. O maior texto medido tem 202.780 caracteres; o teto geral é 80.000.
secao_max_caracteres:
  caracteres: 210000
  motivo: >-
    a seção é a obra inteira do Pastor, uma divisão única do volume de Lightfoot (o ThML da origem não separa
    visões, mandamentos e parábolas); o texto medido tem 202.780 caracteres (medido no derivado, plano 02-10)
limites_pt: >-
  Obra escrita em grego, em Roma, que narra em primeira pessoa as visões de Hermas, um antigo escravo, com as
  explicações que uma senhora e depois um pastor lhe dão; a maior parte dos estudiosos a data na primeira
  metade do século II. É um escrito de exortação e chamado ao arrependimento, em linguagem simbólica, não um
  relato de fatos. Foi muito copiado na antiguidade, e chegou por manuscritos gregos incompletos, por versões
  latinas antigas e por uma versão etíope.
secoes:
  - slug: ii-xiv
    titulo: Texto
    resumo_pt: >-
      Narração em primeira pessoa das visões de Hermas, que reencontra em Roma Roda, a quem fora vendido,
      e recebe de uma mulher idosa, que lhe dizem ser a igreja, a leitura de um livrinho que ele copia e
      deve enviar a Clemente e a Grapte. Ela lhe mostra a torre em construção, a própria igreja, com as
      pedras que entram e as postas de lado; uma quarta visão anuncia a tribulação. O pastor, anjo da
      penitência, entrega mandamentos e parábolas (as varas, as montanhas, as virgens) e exorta ao
      arrependimento enquanto a torre se edifica. Fecha com a partida do anjo que o entregara ao pastor,
      levando consigo o pastor e as virgens e prometendo enviá-los de volta à casa de Hermas.
    palavras_chave_pt: [Hermas, visões, pastor, torre, igreja, arrependimento, mandamentos, parábolas, Roda]
