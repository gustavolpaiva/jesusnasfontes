secao_max_caracteres:
  caracteres: 210000
  motivo: >-
    a seção é a obra inteira do Pastor, uma divisão única do volume de Lightfoot (o ThML da origem não separa
    visões, mandamentos e parábolas); o texto medido tem 202.780 caracteres (medido no derivado, plano 02-10)
limites_pt: >-
  Obra escrita em grego, em Roma, que narra em primeira pessoa as visões de Hermas, um antigo escravo, com as
  explicações que uma senhora e depois um pastor lhe dão; a maior parte dos estudiosos a data na primeira
  metade do século II. É um escrito de exortação e chamado ao arrependimento, em linguagem simbólica, não um
  relato de fatos. Foi muito copiado na antiguidade, e chegou por manuscritos gregos incompletos, por versões
  latinas antigas e por uma versão etíope.
secoes:
  - slug: ii-xiv
    titulo: Texto
    resumo_pt: >-
      Narração em primeira pessoa das visões de Hermas, desde o encontro com Roda, em Roma, e a leitura de um
      livrinho que ele copia e reparte. Uma senhora lhe mostra a torre em construção, que o pastor explica ser
      a igreja, com as pedras que entram e as que são postas de lado, e um anjo de penitência entrega a Hermas
      mandamentos e parábolas — as varas, as montanhas e as virgens — com a exortação a arrependimento enquanto
      a torre ainda se edifica. A obra pede repetidamente obras boas e perseverança aos que já foram batizados,
      e fecha com a partida do pastor e das virgens.
    palavras_chave_pt: [Hermas, visões, pastor, torre, igreja, arrependimento, mandamentos, parábolas, Roda]
