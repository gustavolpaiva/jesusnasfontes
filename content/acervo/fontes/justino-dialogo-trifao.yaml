limites_pt: >-
  Obra escrita em grego em forma de diálogo entre o autor, filósofo cristão, e um judeu erudito chamado
  Trifão, com os amigos deste. A conversa expõe o caminho do autor pelas escolas filosóficas até a conversão
  e debate lei, profetas e fé em Cristo. O texto lido é a tradução inglesa do volume 1 da coleção
  Ante-Nicene Fathers.
secoes:
  - slug: viii-iv
    titulo: Texto
    resumo_pt: >-
      Conversa começada num passeio matinal, quando Trifão, formado com um sócrático, aborda o filósofo:
      Justino conta o caminho pelas escolas — estóico, peripatético, pitagórico e platônico — e a conversão
      por um velho encontrado perto do mar, e Trifão pergunta pela filosofia cristã. No debate sobre a lei, a
      circuncisão, os mandamentos e os profetas, defende o Logos preexistente, o nascimento da virgem, os
      dois adventos de Cristo, o reino de mil anos em Jerusalém e a ressurreição dos mortos. Terminam em paz,
      cada um desejando ao outro a salvação, com a oração de Justino pelos companheiros.
    palavras_chave_pt: [Trifão, filosofia, conversão, lei, circuncisão, profetas, Logos, virgem, milênio, ressurreição]
