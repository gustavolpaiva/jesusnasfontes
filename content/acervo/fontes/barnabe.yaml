# Fonte do Acervo: Carta de Barnabé, na tradução inglesa de Lightfoot (edição CCEL). Circula sob o nome de
# Barnabé, o companheiro de Paulo; a pesquisa corrente não aceita a atribuição e trata a carta como anônima.
# O texto vem do derivado `data/acervo-derivados/barnabe.json`, gerado por `pnpm acervo:derivar` a partir da
# origem `ccel-lightfoot-fathers` (data/acervo-origens.yaml): do volume único de Lightfoot, a divisão ii.xiii.
# O resumo auxiliar é escrita automática de busca (D-18) e nunca substitui o texto.
slug: barnabe
titulo: Carta de Barnabé
autor: null
epoca: fim do século I ou começo do II (estimativa)
nivel: primaria
tipo_texto: integral
idioma: en
publicada: true
licenca: dp-declarado-pela-origem
