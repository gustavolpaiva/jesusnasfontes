# o tradutor das obras (evidência e `tradutor_tambem_editor` registrados em data/acervo-origens.yaml). A
# edição não nomeia nenhum outro responsável (J. R. Harmer não aparece no arquivo); não se inventa.
tradutor: J. B. Lightfoot
editor: J. B. Lightfoot
traduzida_por_nos: false
# A origem não declara a edição (pubHistory vazio): só cita a reimpressão de Baker Book House, 1956. Nenhum
# ano de edição ou de tradução é atribuído de memória (plano 02-10).
edicao: "edição não declarada pela origem; o cabeçalho cita apenas a reimpressão de Baker Book House, 1956; a página de título credencia o volume a J. B. Lightfoot e o cabeçalho digital o descreve como sua coleção e tradução"
limites_pt: >-
  Carta em grego transmitida sob o nome de Barnabé, o companheiro de Paulo, e dirigida a destinatários
  cristãos; a data é debatida, e a maior parte dos estudiosos a situa entre o fim do século I e o começo do
  II. A atribuição não é aceita pela pesquisa corrente, que a trata como anônima. O texto grego completo
  consta do Códice Sinaítico, e uma tradução latina antiga conserva os primeiros capítulos.
secoes:
  - slug: ii-xiii
    titulo: Texto
    resumo_pt: >-
      Carta que saúda filhos e filhas em nome do Senhor e anuncia a proximidade da última ofensa, citando
      Enoque. Interpreta os sacrifícios, os jejuns, as instituições e os alimentos da lei de Moisés como
      figuras espirituais destinadas aos cristãos, em leitura alegórica das escrituras hebraicas, que o
      autor lê como anúncio da paixão de Cristo, do batismo e da cruz. Discute a circuncisão, o descanso
      do sétimo dia, o oitavo dia do Senhor e o verdadeiro templo, que é o coração do crente. Fecha com o
      ensino das duas vias, a da luz e a das trevas, e a despedida aos filhos do amor e da paz.
    palavras_chave_pt: [Barnabé, alegoria, lei de Moisés, Enoque, oitavo dia, duas vias, via da luz]
