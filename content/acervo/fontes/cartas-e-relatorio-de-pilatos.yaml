secoes:
  - slug: vii-xviii
    titulo: Carta ao imperador
    resumo_pt: >-
      Carta curta endereçada a Tibério César: Pilatos reporta que Jesus Cristo, cujo caso já havia
      exposto, foi afinal castigado pela vontade do povo, com certa relutância e medo seus; declara que
      homem tão piedoso e rigoroso nenhuma idade teve nem terá; que sinais sobrenaturais apareceram durante
      a crucificação e, na opinião dos filósofos, ameaçaram o mundo inteiro; e que os discípulos prosperam
      no nome do mestre. Diz não ter resistido de todo, por temor de uma sedição, ao sangue inocente, e
      fecha datando de 28 de março.
    palavras_chave_pt: [carta, Tibério César, Pilatos, sinais, sedição, discípulos]
  - slug: vii-xix
    titulo: Relatório (primeira forma grega)
    resumo_pt: >-
      Relatório enviado a César em Roma: Pilatos narra que os judeus lhe entregaram Jesus com acusações
      que não provaram — as curas em sábado e a ressurreição de um morto de quatro dias —, obras que julga
      maiores que as dos deuses romanos; que Herodes, Arquelau, Filipe, Anás e Caifás com o povo o
      entregaram, e ele ordenou a crucificação sem achar culpa. Seguem os sinais: trevas ao meio-dia, a lua
      como sangue, o abismo que tragou judeus e santuário, mortos que apareciam — Abraão, os patriarcas,
      Moisés e Jó —, homens gloriosos anunciando a ressurreição e a luz de toda a noite, até só restar uma
      sinagoga em Jerusalém. Fecha entre perplexidade e tremor.
    palavras_chave_pt: [relatório, César, Lázaro de quatro dias, trevas, lua como sangue, mortos que aparecem, Hades, sinagoga]
  - slug: vii-xx
    titulo: Relatório (segunda forma grega)
    resumo_pt: >-
      A segunda forma do relatório a Tibério repete a armação — as curas em sábado e o morto de quatro
      dias que ressuscita cheio de fragrância, a entrega por Herodes, Arquelau, Filipe, Anás e Caifás, a
      ordem de crucificação sem culpa achada — e descreve os sinais com traços próprios: as estrelas e
      Órion lamentando a maldade dos judeus, a lua como sangue em noite de lua cheia, os mortos que os
      judeus dizem ter visto em corpo (Abraão, Isaac, Jacó, os doze patriarcas e Noé), a multidão de anjos
      clamando glória a Deus e chamando os cativos para fora do Hades, e as fendas de terra que tragam os
      adversários. Fecha dizendo ter mandado escrever tudo na mesma hora, entre perplexidade e muito
      tremor.
    palavras_chave_pt: [segunda forma, Órion, lua cheia, Noé, anjos, Hades, fendas de terra, Tibério]
