limites_pt: >-
  Obra escrita em grego por um autor judeu a serviço de Roma, por volta de 93 d.C., e preservada pela tradição
  cristã, não pela judaica. O texto lido aqui é a tradução inglesa de Whiston (1737), feita a partir de
  manuscritos medievais. O trecho sobre Jesus (Testimonium Flavianum, 18.63) é discutido há séculos como
  sujeito a acréscimos de copistas cristãos. A numeração dos parágrafos é a da edição digital: o número de cada
  parágrafo é o primeiro da numeração de Niese que ele contém.
