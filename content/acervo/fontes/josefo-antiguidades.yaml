secao_max_caracteres:
  caracteres: 170000
  motivo: >-
    a seção é um livro inteiro das Antiguidades, página de leitura contínua aceita pelo UI-SPEC; o maior livro
    medido tem 161.056 caracteres, o Livro 8 (decisão do plano 02-08)
limites_pt: >-
  Obra escrita em grego por um autor judeu a serviço de Roma, por volta de 93 d.C., e preservada pela tradição
  cristã, não pela judaica. O texto lido é a tradução inglesa de Whiston (1737), feita a partir de manuscritos
  medievais. O trecho sobre Jesus (Testimonium Flavianum, 18.63) é discutido há séculos como sujeito a
  acréscimos de copistas cristãos.
secoes:
  - slug: "1"
    titulo: Livro 1
    resumo_pt: >-
      Cobre da criação do mundo à morte de Isaac, incluindo o dilúvio e as gerações entre Adão e os patriarcas.
      Abre com o prefácio da obra, em que o autor expõe as razões que o levaram a escrever a história dos judeus.
    palavras_chave_pt: [criação, dilúvio, Noé, Abraão, patriarcas]
  - slug: "2"
    titulo: Livro 2
    resumo_pt: >-
      Cobre o período que segue a morte de Isaac: Esaú e Jacó, a história de José no Egito, a escravidão dos
      hebreus, o nascimento e a juventude de Moisés, as pragas e a saída do Egito, com a travessia do mar e a
      marcha até o monte Sinai.
    palavras_chave_pt: [José, Egito, Jacó, Moisés, escravidão no Egito, êxodo, travessia do mar, Sinai]
  - slug: "3"
    titulo: Livro 3
    resumo_pt: >-
      Cobre a marcha dos hebreus pelo deserto depois da saída do Egito: o maná, a batalha contra Amaleque, a
      entrega da lei no monte Sinai, a construção do tabernáculo e as leis dos sacrifícios, até a partida do
      Sinai, os doze espias e a sentença dos quarenta anos de peregrinação.
    palavras_chave_pt: [deserto, Sinai, lei, tabernáculo, espias, quarenta anos]
  - slug: "4"
    titulo: Livro 4
    resumo_pt: >-
      Cobre o fim da peregrinação no deserto: as revoltas dos hebreus, o território conquistado a leste do
      Jordão, o censo do povo e a morte de Moisés, com a sucessão de Josué.
    palavras_chave_pt: [Moisés, Josué, deserto, morte de Moisés, sucessão]
  - slug: "5"
    titulo: Livro 5
    resumo_pt: >-
      Cobre a conquista de Canaã sob Josué, a divisão da terra entre as tribos e o período dos juízes, até o
      sacerdócio de Eli e o nascimento de Samuel.
    palavras_chave_pt: [Josué, conquista de Canaã, Jericó, juízes, Eli, Samuel]
  - slug: "6"
    titulo: Livro 6
    resumo_pt: >-
      Cobre o tempo em que a arca esteve em poder dos filisteus, o governo de Samuel, a escolha e as guerras de
      Saul e a ascensão de Davi, até a morte de Saul na batalha.
    palavras_chave_pt: [filisteus, arca da aliança, Samuel, Saul, Davi]
  - slug: "7"
    titulo: Livro 7
    resumo_pt: >-
      Cobre o reinado de Davi: a lamentação por Saul, a tomada de Jerusalém, as guerras contra os vizinhos, a
      revolta de Absalão e o censo do povo, até os preparativos para o Templo e a morte e o sepultamento do
      rei.
    palavras_chave_pt: [Davi, Jerusalém, Absalão, guerras, censo, morte de Davi]
  - slug: "8"
    titulo: Livro 8
    resumo_pt: >-
      Cobre o reinado de Salomão, com a construção do Templo, a fama do rei e a visita de uma rainha
      estrangeira, e, após a sua morte, a divisão do reino sob Roboão e Jeroboão, seguindo os primeiros reis de
      Judá e de Israel até a morte de Acabe.
    palavras_chave_pt: [Salomão, Templo, Roboão, Jeroboão, divisão do reino, Acabe]
  - slug: "9"
    titulo: Livro 9
    resumo_pt: >-
      Cobre os reis de Judá e de Israel depois da divisão: Josafá, os profetas Elias e Eliseu e as guerras
      contra a Síria, o extermínio da casa de Acabe por Jeú, a rainha Atalia em Jerusalém e os reis seguintes,
      até a tomada de Samaria pelos assírios, o cativeiro das dez tribos e a origem dos samaritanos.
    palavras_chave_pt: [Elias, Eliseu, Josafá, Jeú, Atalia, Samaria, samaritanos]
  - slug: "10"
    titulo: Livro 10
    resumo_pt: >-
      Cobre o reinado de Ezequias e a invasão assíria de Senaqueribe, a reforma de Josias, a destruição de
      Jerusalém por Nabucodonosor e o cativeiro na Babilônia, até o profeta Daniel e o tempo de Ciro.
    palavras_chave_pt: [Ezequias, Senaqueribe, Josias, Nabucodonosor, cativeiro babilônico, Daniel]
  - slug: "11"
    titulo: Livro 11
    resumo_pt: >-
      Cobre o decreto de Ciro e o fim do cativeiro babilônico, a reconstrução do Templo sob Zorobabel com a
      oposição dos vizinhos, a história de Ester na corte persa, a missão de Neemias em Jerusalém e a vinda de
      Alexandre, o Grande, até a morte do sumo sacerdote Jadua.
    palavras_chave_pt: [Ciro, retorno do cativeiro, Zorobabel, Ester, Neemias, Alexandre, reconstrução do Templo]
  - slug: "12"
    titulo: Livro 12
    resumo_pt: >-
      Cobre o tempo dos sucessores de Alexandre: o domínio dos Ptolomeus e dos Selêucidas sobre a Judeia, a
      tradução da lei judaica para o grego, os sumos sacerdotes e as guerras entre os reis, a perseguição de
      Antíoco Epifânio e a revolta dos Macabeus, até a morte de Judas Macabeu.
    palavras_chave_pt: [Ptolomeus, Selêucidas, tradução grega, sumos sacerdotes, Antíoco Epifânio, Macabeus, Judas Macabeu]
  - slug: "13"
    titulo: Livro 13
    resumo_pt: >-
      Cobre a continuação da revolta dos Macabeus depois da morte de Judas: o comando de Jônatas e de Simão,
      João Hircano e a dinastia asmoneia, as lutas contra os reis selêucidas e os vizinhos, a aliança com Roma
      e o reinado de Alexandra.
    palavras_chave_pt: [Macabeus, asmoneus, Jônatas, Simão, João Hircano, aliança com Roma, Alexandra]
  - slug: "14"
    titulo: Livro 14
    resumo_pt: >-
      Cobre a disputa entre Hircano e Aristóbulo, a intervenção de Pompeu e a conquista romana de Jerusalém, a
      ascensão de Antípatro e de seu filho Herodes e a invasão dos partos, até a nomeação de Herodes como rei
      pelos romanos, a tomada da cidade por Herodes e Sósio, a morte de Antígono e o fim da dinastia asmoneia.
    palavras_chave_pt: [Pompeu, Hircano, Aristóbulo, Antípatro, Herodes, Antígono]
  - slug: "15"
    titulo: Livro 15
    resumo_pt: >-
      Cobre os primeiros anos do reinado de Herodes: a consolidação do poder depois da queda de Antígono, as
      obras de Samaria e Cesareia, as crises em torno de Mariamne e a reconstrução do Templo, concluída no fim
      do livro.
    palavras_chave_pt: [Herodes, Antígono, Cesareia, Templo, Mariamne]
  - slug: "16"
    titulo: Livro 16
    resumo_pt: >-
      Cobre o governo de Herodes: as leis e a administração do reino, as viagens e as honras do imperador, o
      patrocínio de Agripa, as tensões com os judeus da diáspora e as acusações contra os filhos do rei, até a
      execução de Alexandre e Aristóbulo.
    palavras_chave_pt: [Herodes, Agripa, administração do reino, diáspora judaica, filhos de Herodes]
  - slug: "17"
    titulo: Livro 17
    resumo_pt: >-
      Cobre os últimos anos de Herodes: a conspiração e a condenação de Antípatro, o testamento e a morte do
      rei, as disputas entre os seus filhos, a revolta reprimida por Varo e a divisão do reino, até a deposição
      de Arquelau, quando a Judeia passa a província romana.
    palavras_chave_pt: [Herodes, Antípatro, Arquelau, testamento de Herodes, revolta, Varo]
  - slug: "18"
    titulo: Livro 18
    resumo_pt: >-
      Cobre o governo romano da Judeia depois de Arquelau: o censo de Quirino, os procuradores, entre eles
      Pôncio Pilatos, os sumos sacerdotes entre eles Caifás, a morte de João Batista por ordem de Antipas e a
      morte do imperador Tibério; traz ainda a passagem sobre Jesus conhecida como Testimonium Flavianum.
    palavras_chave_pt: [Pilatos, Caifás, João Batista, Jesus, censo de Quirino, procuradores romanos, Tibério]
  - slug: "19"
    titulo: Livro 19
    resumo_pt: >-
      Cobre os excessos de Calígula contra judeus e romanos e o seu assassinato, a ascensão de Cláudio e o
      reinado de Agripa na Judeia, até a morte deste rei.
    palavras_chave_pt: [Calígula, assassinato de Calígula, Cláudio, Agripa, Judeia]
  - slug: "20"
    titulo: Livro 20
    resumo_pt: >-
      Cobre os procuradores da Judeia de Fado a Floro — entre eles Félix, Festo e Albino —, o sumo sacerdote
      Anano e a morte de Tiago, irmão de Jesus, o governo de Agripa II e os começos da guerra contra Roma.
    palavras_chave_pt: [Tiago, irmão de Jesus, Anano, Festo, Floro, Agripa II]
