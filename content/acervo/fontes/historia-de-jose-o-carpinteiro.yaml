secoes:
  - slug: vii-vii
    titulo: Texto
    resumo_pt: >-
      Discurso de Jesus aos apóstolos no monte das Oliveiras sobre a morte de José: velho
      viúvo com quatro filhos e duas filhas, recebeu Maria aos doze anos; seguem o nascimento em Belém, a
      fuga ao Egito e a vida em Nazaré. Adoecido aos cento e onze anos, José teme a morte e reza pedindo o
      arcanjo Miguel; Jesus e Maria o acompanham, Jesus vê a Morte chegar com o inferno e a repele, e
      Miguel e Gabriel levam a alma numa veste brilhante. O corpo é sepultado junto de Jacó, declarado
      incorruptível até o banquete dos mil anos, com bênçãos a quem celebrar a sua memória. No fecho, sobre
      Enoque e Elias, que não morreram, Jesus diz que hão de voltar no fim dos tempos e morrer às mãos do
      Anticristo.
    palavras_chave_pt: [José o carpinteiro, monte das Oliveiras, cento e onze anos, arcanjo Miguel, Morte repelida, banquete dos mil anos, Enoque e Elias, Anticristo]
