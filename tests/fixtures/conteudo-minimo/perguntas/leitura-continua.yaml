# Três conjuntos de perguntas de teste, com textos distintos para provar a troca a cada volta.
- - "Conjunto um, pergunta um?"
  - "Conjunto um, pergunta dois?"
  - "Conjunto um, pergunta três?"
- - "Conjunto dois, pergunta um?"
  - "Conjunto dois, pergunta dois?"
  - "Conjunto dois, pergunta três?"
- - "Conjunto três, pergunta um?"
